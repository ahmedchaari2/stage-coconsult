spring.application.name=config-server
server.port=8888

# config-repo lives as a plain directory inside this mono-repo (not its own git
# checkout), so the config server reads it straight off disk instead of git-cloning
# it. CONFIG_REPO_PATH lets docker-compose point this at the mounted volume.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:../config-repo}
