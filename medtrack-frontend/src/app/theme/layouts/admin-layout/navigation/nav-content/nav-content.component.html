<ng-scrollbar style="height: calc(100vh - 40px)" visibility="hover" id="nav-ps">
  <div class="navbar-content">
    <ul class="nav coded-inner-navbar" (click)="fireOutClick()" (mouseleave)="navMob()">
      @for (item of visibleNavigations(); track item.id) {
        @if (item.type === 'group') {
          <app-nav-group [item]="item" />
        } @else if (item.type === 'item') {
          <app-nav-item [item]="item" />
        } @else if (item.type === 'divider') {
          <li class="nav-divider" role="separator"></li>
        }
      }
    </ul>
  </div>
</ng-scrollbar>
