@if (!item().hidden) {
  <li class="nav-item coded-hasmenu" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{ exact: item().exactMatch ?? false }">
    <a
      [routerLinkActive]="['active']"
      [routerLinkActiveOptions]="{ exact: item().exactMatch ?? false }"
      class="nav-link"
      (click)="navCollapse($event)"
    >
      <ng-container *ngTemplateOutlet="itemContent" />
    </a>
    <ng-container *ngTemplateOutlet="subMenuContent" />
  </li>
}

<ng-template #itemContent>
  @if (item().icon) {
    <span class="coded-micon">
      <i antIcon type="{{ item().icon }}" theme="outline"></i>
    </span>
  }
  <span class="coded-mtext">
    {{ item().translate ? (item().translate! | transloco) : item().title }}
  </span>
</ng-template>
<ng-template #subMenuContent>
  <ul class="coded-submenu" [routerLinkActive]="['active']" [ngClass]="item().classes!">
    @for (items of item().children; track items) {
      @if (items.type === 'item' && !items.hidden) {
        <app-nav-item [item]="items" />
      } @else if (items.type === 'collapse' && !items.hidden) {
        <app-nav-collapse [item]="items" />
      }
    }
  </ul>
</ng-template>
