<ul class="list-unstyled">
  <li class="pc-h-item pc-sidebar-collapse">
    <button
      type="button"
      class="pc-head-link ms-0 bg-transparent border-0"
      [ngClass]="{ on: navCollapsed() }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
      [attr.aria-label]="'nav.actions.toggleSidebar' | transloco"
    >
      @if (navCollapsed() === true) {
        <i antIcon type="menu-unfold" theme="outline" aria-hidden="true"></i>
      } @else {
        <i antIcon type="menu-fold" theme="outline" aria-hidden="true"></i>
      }
    </button>
  </li>
  <li class="pc-h-item pc-sidebar-popup">
    <button
      type="button"
      class="pc-head-link ms-0 bg-transparent border-0"
      id="mobile-collapse1"
      (click)="navCollapsedMob()"
      [attr.aria-label]="'nav.actions.toggleMobileMenu' | transloco"
    >
      <i antIcon type="menu-fold" theme="outline" aria-hidden="true"></i>
    </button>
  </li>
</ul>
