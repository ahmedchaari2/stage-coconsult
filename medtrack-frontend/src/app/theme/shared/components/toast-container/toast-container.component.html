<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
  @for (t of toasts(); track t.id) {
    <ngb-toast [class]="toastCssClass(t.type)" [autohide]="true" [delay]="5000" (hidden)="remove(t.id)">
      <div class="d-flex">
        <div class="toast-body flex-grow-1">{{ t.message }}</div>
        <button
          type="button"
          class="btn-close me-2 m-auto"
          [class.btn-close-white]="t.type !== 'warning'"
          (click)="remove(t.id)"
          aria-label="Fermer"
        ></button>
      </div>
    </ngb-toast>
  }
</div>
