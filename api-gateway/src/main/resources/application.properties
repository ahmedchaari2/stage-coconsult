spring.application.name=api-gateway

# Toute la config de ce service vient du config-server (config-repo/application.yml pour le
# commun, config-repo/api-gateway.yml pour le specifique). Import non optionnel : si le
# config-server n'est pas joignable, le demarrage echoue franchement au lieu de laisser le
# service tourner sans datasource ni secrets. Le config-server doit donc demarrer en premier.
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
